<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 交互粒子系统 - 专业版</title>
    <style>
        :root {
            --glass-bg: rgba(20, 25, 30, 0.75);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent-color: #00d2ff;
            --text-color: #ffffff;
        }

        body { margin: 0; overflow: hidden; background-color: #050505; font-family: 'Segoe UI', Roboto, sans-serif; color: var(--text-color); }
        canvas { display: block; }

        /* --- UI 布局 --- */
        
        /* 侧边栏容器 */
        #sidebar {
            position: absolute;
            top: 0;
            left: 0;
            width: 280px;
            height: 100vh;
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-right: 1px solid var(--glass-border);
            padding: 20px;
            box-sizing: border-box;
            transform: translateX(0);
            transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            z-index: 100;
            display: flex;
            flex-direction: column;
        }

        /* 折叠状态 */
        #sidebar.collapsed {
            transform: translateX(-100%);
        }

        /* 切换按钮 (汉堡菜单) */
        #toggle-btn {
            position: absolute;
            top: 20px;
            left: 20px; /* 初始位置 */
            z-index: 101;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            transition: left 0.4s cubic-bezier(0.22, 1, 0.36, 1), background 0.2s;
        }
        
        #toggle-btn:hover { background: rgba(255,255,255,0.2); }
        
        /* 当侧边栏打开时，按钮随之移动 (通过JS控制类名或者计算) 
           这里简化处理：侧边栏内部有个占位头部，外部按钮固定 */
        body.menu-open #toggle-btn {
            left: 300px; /* 移到侧边栏旁边 */
            background: transparent;
            border: none;
        }

        /* 侧边栏内容 */
        .sidebar-header {
            margin-top: 40px; /* 避开切换按钮 */
            margin-bottom: 30px;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 15px;
        }
        .sidebar-header h2 { margin: 0; font-size: 18px; font-weight: 500; letter-spacing: 1px; }
        .sidebar-header span { font-size: 12px; opacity: 0.5; }

        .control-section { margin-bottom: 25px; }
        .label { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: rgba(255,255,255,0.5); margin-bottom: 10px; }

        /* 模型按钮网格 */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid transparent;
            color: rgba(255,255,255,0.8);
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
            text-align: center;
        }
        .btn:hover { background: rgba(255,255,255,0.15); }
        .btn.active {
            background: rgba(0, 210, 255, 0.15);
            border-color: var(--accent-color);
            color: var(--accent-color);
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.1);
        }

        /* 颜色选择 */
        .color-row { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.05); padding: 8px; border-radius: 6px;}
        input[type="color"] {
            -webkit-appearance: none; border: none; width: 30px; height: 30px; background: none; cursor: pointer;
        }
        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch { border: none; border-radius: 4px; }

        /* 状态指示器 */
        .status-box {
            margin-top: auto; /* 推到底部 */
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            padding: 15px;
            font-size: 12px;
            line-height: 1.5;
            color: rgba(255,255,255,0.6);
        }
        .status-dot {
            display: inline-block; width: 8px; height: 8px; background: #555; border-radius: 50%; margin-right: 6px;
            transition: 0.3s;
        }
        .status-dot.active { background: #00ff88; box-shadow: 0 0 8px #00ff88; }

        /* 全屏按钮 */
        #fullscreen-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 44px; height: 44px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 50%;
            color: white;
            font-size: 20px;
            cursor: pointer;
            z-index: 50;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.2s;
        }
        #fullscreen-btn:hover { background: rgba(255,255,255,0.3); }

        /* 加载与视频 */
        #video-input { display: none; }
        #loader {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            text-align: center; pointer-events: none; z-index: 200;
        }
        .spinner {
            width: 50px; height: 50px; border: 3px solid rgba(255,255,255,0.1);
            border-top-color: var(--accent-color); border-radius: 50%;
            animation: spin 1s linear infinite; margin: 0 auto 15px;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

    </style>
</head>

    <video id="video-input"></video>

                <div class="btn" data-shape="flower">🌸 花朵</div>

                <div class="btn" data-shape="buddha">🧘 佛像</div>
                <div class="btn" data-shape="fireworks">🎆 烟花</div>
            </div>
        </div>

        <div class="control-section">
            <span class="label">主题色彩</span>
            <div class="color-row">
                <input type="color" id="color-picker" value="#00ff88">
                <span style="font-size:12px; opacity:0.8">点击调整基调色</span>
            </div>
        </div>

            <div style="display:flex; align-items:ce
